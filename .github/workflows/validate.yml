name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the repo and every skill
        run: python3 scripts/validate_repo.py
      - name: Validate the v2 employee contract
        run: python3 scripts/validate_repo_v2.py --strict
      - name: Validate the plugin manifests
        run: python3 scripts/validate_manifests.py
